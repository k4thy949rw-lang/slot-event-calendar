
name: 追加サイト接続テスト

on:
  workflow_dispatch:

jobs:
  test-sources:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要ライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: 追加サイトの接続テストを実行
        run: python test_sources.py
