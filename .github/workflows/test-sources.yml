
name: 追加サイト接続テスト

on:
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * *'

permissions:
  contents: write

jobs:
  test-sources:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要ライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: 抽出結果をファイルに保存
        run: python test_sources.py > source_probe.txt 2>&1

      - name: 結果をリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_probe.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save event source diagnostics"
            git push
          fi
